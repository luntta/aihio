<!-- A table announced only as "table", whose scroll box on a phone has no
     name either. -->

  <table>
    <thead>
      <tr><th scope="col">Invoice</th><th scope="col" data-numeric>Amount</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">INV-1042</th><td data-numeric>€1,250.00</td></tr>
    </tbody>
  </table>
</aihio-table>
