<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aihio Dev Warning Tests</title>
</head>
<body data-status="running">
  <main id="sandbox"></main>
  <pre id="results"></pre>

  <script type="module">
    import '../../dist/aihio.dev.js';  // installs the warnings itself

    globalThis.requestAnimationFrame = (callback) => setTimeout(() => callback(performance.now()), 0);
    globalThis.cancelAnimationFrame = (handle) => clearTimeout(handle);

    const sandbox = document.querySelector('#sandbox');
    const resultsNode = document.querySelector('#results');
    const warnings = [];
    const results = [];
    const originalWarn = console.warn.bind(console);

    console.warn = (...args) => {
      warnings.push(args.map((arg) => typeof arg === 'string' ? arg : JSON.stringify(arg)).join(' '));
    };

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }

    async function nextFrame(count = 1) {
      for (let index = 0; index < count; index += 1) {
        await new Promise((resolve) => requestAnimationFrame(resolve));
      }
    }

    async function runTest(name, fn) {
      try {
        warnings.length = 0;
        sandbox.replaceChildren();
        await fn();
        results.push({ name, pass: true });
      } catch (error) {
        results.push({
          name,
          pass: false,
          message: error?.stack ?? String(error),
        });
      }
    }

    try {
      await runTest('dev warnings report schema and a11y violations', async () => {
        sandbox.innerHTML = `
          <aihio-button id="bad-button" variant="primary" size="icon">&#x2715;</aihio-button>
          <aihio-alert id="bad-alert" variant="destructive"></aihio-alert>
          <aihio-avatar id="bad-avatar" src="/avatar.jpg"></aihio-avatar>
          <aihio-input id="bad-input" error></aihio-input>
          <aihio-dialog id="bad-dialog" open>
            <p>Delete?</p>
          </aihio-dialog>
          <aihio-dropdown id="bad-dropdown">
            <aihio-button slot="trigger" size="icon">&#x22ef;</aihio-button>
            <aihio-dropdown-item>Profile</aihio-dropdown-item>
          </aihio-dropdown>
          <aihio-tabs id="bad-tabs" value="one">
            <aihio-tab-list>
              <aihio-tab value="one">One</aihio-tab>
            </aihio-tab-list>
            <aihio-tab-panel value="two">Panel</aihio-tab-panel>
          </aihio-tabs>
          <aihio-toggle id="bad-toggle"></aihio-toggle>
          <aihio-toggle id="false-toggle" pressed="false">Bold</aihio-toggle>
          <aihio-combobox id="bad-combobox" placeholder="Plan">
            <aihio-option>Pro</aihio-option>
            <aihio-option value="Pro">Pro (annual)</aihio-option>
          </aihio-combobox>
          <aihio-table id="bad-table">
            <table>
              <tbody><tr onclick="openInvoice()"><td>INV-1042</td><td>€1,250.00</td></tr></tbody>
            </table>
          </aihio-table>
          <aihio-data-grid id="bad-grid">
            <table aria-label="Requests">
              <thead><tr><th scope="col" data-sortable>Request</th></tr></thead>
              <tbody></tbody>
            </table>
          </aihio-data-grid>
          <aihio-pagination id="bad-pagination" page="13" pages="12" href="/invoices?page="></aihio-pagination>
          <aihio-date-picker id="bad-date" placeholder="Due date" value="10/09/2026"></aihio-date-picker>
          <aihio-calendar id="bad-calendar" min="2026-12-01" max="2026-11-01"></aihio-calendar>
          <aihio-table id="bad-sort">
            <table aria-label="Amounts">
              <thead><tr><th scope="col" aria-sort="asc" data-sortable data-numeric="false">Amount</th></tr></thead>
              <tbody><tr><td>€1,250.00</td></tr></tbody>
            </table>
          </aihio-table>
        `;
        await nextFrame(4);

        assert(
          warnings.some((message) => message.includes('aihio-button') && message.includes('invalid variant="primary"') && message.includes('Use variant="default"')),
          'invalid enum warning should mention the button variant'
        );
        assert(
          warnings.some((message) => message.includes('aihio-button') && message.includes('Provide aria-label describing the action')),
          'button should warn when an icon-only control lacks an accessible name'
        );
        assert(
          warnings.some((message) => message.includes('aihio-alert') && message.includes('slot="title" or slot="description"')),
          'destructive alerts should warn when they have no announced content'
        );
        assert(
          warnings.some((message) => message.includes('aihio-avatar') && message.includes('Provide alt describing the person or entity')),
          'avatars with src should warn when alt is missing'
        );
        assert(
          warnings.some((message) => message.includes('aihio-input') && message.includes('Provide aria-label on aihio-input')),
          'input should warn when no label is associated'
        );
        assert(
          warnings.some((message) => message.includes('aihio-input') && message.includes('aria-describedby')),
          'input should warn when error state has no describedby message'
        );
        assert(
          warnings.some((message) => message.includes('aihio-dialog') && message.includes('Provide aria-label on aihio-dialog')),
          'dialog should warn when neither a title nor aria-label is present'
        );
        assert(
          warnings.some((message) => message.includes('aihio-dropdown') && message.includes('Provide aria-label on the trigger')),
          'dropdown should warn when an icon-only trigger has no accessible name'
        );
        assert(
          warnings.some((message) => message.includes('aihio-tabs') && message.includes('Match each tab\'s value to exactly one panel\'s value')),
          'tabs should warn when tab and panel values do not match one-to-one'
        );
        assert(
          warnings.some((message) => message.includes('aihio-toggle') && message.includes('Provide aria-label describing what the toggle controls')),
          'toggle should warn when icon-only content has no accessible name'
        );
        assert(
          warnings.some((message) => message.includes('aihio-combobox') && message.includes('Label it with aria-labelledby')),
          'combobox should warn when it has no label'
        );
        assert(
          warnings.some((message) => message.includes('aihio-combobox') && message.includes('distinct value')),
          'combobox should warn when two options share a value'
        );
        assert(
          warnings.some((message) => message.includes('aihio-toggle') && message.includes('pressed="false" turns pressed on')),
          'a boolean attribute written as "false" should warn'
        );
        assert(
          warnings.some((message) => message.includes('aihio-data-grid') && message.includes('Set row-count to how many rows there are')),
          'a grid should warn when it has no row count'
        );
        assert(
          warnings.some((message) => message.includes('aihio-data-grid') && message.includes('Give each sortable header a name')),
          'a grid should warn when a sortable header has no column name'
        );
        assert(
          warnings.some((message) => message.includes('aihio-pagination') && message.includes('Set pages to how many pages there are')),
          'a pagination should warn when its page is outside its pages'
        );
        assert(
          warnings.some((message) => message.includes('aihio-pagination') && message.includes('Put {page} where the page number goes')),
          'a pagination should warn when its href has no {page}'
        );
        assert(
          warnings.some((message) => message.includes('aihio-date-picker') && message.includes('fold the open calendar')),
          'a date picker should warn when it has no label'
        );
        assert(
          warnings.some((message) => message.includes('aihio-date-picker') && message.includes('value="10/09/2026" is not a date')),
          'a date picker should warn when a date attribute is not YYYY-MM-DD'
        );
        assert(
          warnings.some((message) => message.includes('aihio-calendar') && message.includes('Name it after what the date is for')),
          'a calendar should warn when nothing names it'
        );
        assert(
          warnings.some((message) => message.includes('aihio-calendar') && message.includes('is after max')),
          'a calendar should warn when min is after max'
        );
        assert(
          warnings.some((message) => message.includes('aihio-table') && message.includes('Name the table')),
          'a table should warn when nothing names it'
        );
        assert(
          warnings.some((message) => message.includes('aihio-table') && message.includes('Name each column with a <th>')),
          'a table should warn when it has no header cells'
        );
        assert(
          warnings.some((message) => message.includes('aihio-table') && message.includes('reachable by pointer only')),
          'a table should warn when a row responds to clicks with nothing to focus'
        );
        assert(
          warnings.some((message) => message.includes('aihio-table') && message.includes('invalid aria-sort="asc" on <th>') && message.includes('Use aria-sort="ascending"')),
          'an invalid aria-sort on a header cell should warn with the fix'
        );
        assert(
          warnings.some((message) => message.includes('aihio-table') && message.includes('data-numeric="false" turns data-numeric on')),
          'a boolean attribute written as "false" on a header cell should warn'
        );
      });

      await runTest('dev runtime introspection and aria sync remain available', async () => {
        sandbox.innerHTML = `
          <label>
            Email
            <aihio-input id="good-input" aria-describedby="good-help" aria-label="Email"></aihio-input>
          </label>
          <p id="good-help">Use your work address.</p>

          <aihio-dialog id="good-dialog" aria-label="Confirm archive">
            <p>Archive this project?</p>
          </aihio-dialog>

          <aihio-alert id="good-alert" variant="destructive">
            <div slot="title">Delete failed</div>
            <div slot="description">Try again.</div>
          </aihio-alert>

          <aihio-avatar id="good-avatar" src="/avatar.jpg" alt="Jane Doe"></aihio-avatar>

          <aihio-dropdown id="good-dropdown">
            <aihio-button slot="trigger" size="icon" aria-label="Open menu">&#x22ef;</aihio-button>
            <aihio-dropdown-item>Profile</aihio-dropdown-item>
          </aihio-dropdown>

          <aihio-tabs id="good-tabs" value="one">
            <aihio-tab-list>
              <aihio-tab value="one">One</aihio-tab>
              <aihio-tab value="two">Two</aihio-tab>
            </aihio-tab-list>
            <aihio-tab-panel value="one">Panel one</aihio-tab-panel>
            <aihio-tab-panel value="two">Panel two</aihio-tab-panel>
          </aihio-tabs>

          <aihio-toggle id="good-toggle" aria-label="Bold"></aihio-toggle>

          <aihio-field>
            <label slot="label">Country</label>
            <aihio-combobox id="good-combobox" name="country">
              <aihio-option value="fi">Finland</aihio-option>
              <aihio-option value="se">Sweden</aihio-option>
            </aihio-combobox>
          </aihio-field>

          <aihio-data-grid id="good-grid" row-count="2" style="--aihio-data-grid-height: 6rem">
            <table aria-label="Requests">
              <thead><tr><th scope="col" data-sortable="id">Request</th><th scope="col" data-numeric>Duration</th></tr></thead>
              <tbody>
                <tr><th scope="row"><a href="#request-1">#1</a></th><td data-numeric>12</td></tr>
                <tr><th scope="row"><a href="#request-2">#2</a></th><td data-numeric>40</td></tr>
              </tbody>
            </table>
          </aihio-data-grid>

          <aihio-pagination id="good-pagination" page="2" pages="4" href="#invoices-page-{page}" aria-label="Invoice pages"></aihio-pagination>

          <aihio-table id="good-table">
            <table>
              <caption>Invoices</caption>
              <thead>
                <tr>
                  <th scope="col" data-sortable aria-sort="ascending">Invoice</th>
                  <th scope="col" data-numeric>Amount</th>
                </tr>
              </thead>
              <tbody>
                <tr><th scope="row"><a href="#invoice-1042">INV-1042</a></th><td data-numeric>€1,250.00</td></tr>
              </tbody>
            </table>
          </aihio-table>
        `;
        await nextFrame(4);

        const input = document.querySelector('#good-input');
        const innerInput = input.querySelector('input');
        const dialog = document.querySelector('#good-dialog');
        const panel = dialog.shadowRoot.querySelector('.panel');

        assert(globalThis.Aihio.describe('aihio-input')?.version === '1.2.0', 'Aihio.describe should expose the input schema');
        assert(innerInput.getAttribute('aria-label') === 'Email', 'input host aria-label should sync to the inner input');
        assert(innerInput.getAttribute('aria-describedby') === 'good-help', 'input host aria-describedby should sync to the inner input');
        assert(panel.getAttribute('aria-label') === 'Confirm archive', 'dialog host aria-label should sync to the panel');
        assert(warnings.length === 0, `valid markup should not warn, received: ${warnings.join('\n')}`);
      });

      await runTest('a grid warns once its row count passes what browsers can scroll', async () => {
        sandbox.innerHTML = `
          <aihio-data-grid id="long-grid" row-count="2" style="--aihio-data-grid-height: 6rem">
            <table aria-label="Requests">
              <thead><tr><th scope="col">Request</th></tr></thead>
              <tbody><tr><td>#1</td></tr><tr><td>#2</td></tr></tbody>
            </table>
          </aihio-data-grid>
        `;
        await nextFrame(2);
        assert(warnings.length === 0, `two rows should not warn, received: ${warnings.join('\n')}`);

        // A count set from script, as one fetched from a server is.
        document.querySelector('#long-grid').rowCount = 2000000;
        await nextFrame(2);
        assert(
          warnings.some((message) => message.includes('aihio-data-grid') && message.includes('Firefox stops a box')),
          `a grid should warn when its rows pass what browsers can scroll, received: ${warnings.join('\n')}`
        );
      });

      await runTest('an element removed from the page no longer warns', async () => {
        sandbox.innerHTML = `<aihio-avatar id="removed-avatar" src="/missing-avatar.jpg"></aihio-avatar>`;
        const avatar = document.querySelector('#removed-avatar');
        const image = avatar.querySelector('img');
        await nextFrame(2);

        avatar.remove();
        warnings.length = 0;
        // The image can fail after the avatar has left the page, which makes
        // the avatar refresh.
        image.dispatchEvent(new Event('error'));
        await nextFrame(2);

        assert(warnings.length === 0, `a removed element should not warn, received: ${warnings.join('\n')}`);
      });

      await runTest('an invoked command that its target ignores is reported', async () => {
        sandbox.innerHTML = `
          <aihio-button id="builtin" commandfor="confirm" command="show-modal">Built-in</aihio-button>
          <aihio-button id="custom" commandfor="confirm" command="--open">Custom</aihio-button>
          <aihio-dialog id="confirm" aria-label="Confirm"><p>Sure?</p></aihio-dialog>
        `;
        await nextFrame(2);
        assert(warnings.length === 0, `commands should not warn before they are invoked, received: ${warnings.join('\n')}`);

        document.querySelector('#builtin').click();
        assert(
          warnings.some((warning) => warning.includes('aihio-button') && warning.includes('built-in command "show-modal"')),
          `a built-in command aimed at aihio-dialog should warn, received: ${warnings.join('\n')}`
        );

        warnings.length = 0;
        document.querySelector('#custom').click();
        await nextFrame(2);
        assert(warnings.length === 0, `a declared command should not warn, received: ${warnings.join('\n')}`);
        document.querySelector('#confirm').close();
      });
    } finally {
      console.warn = originalWarn;
    }

    const failed = results.some((result) => !result.pass);
    document.body.dataset.status = failed ? 'fail' : 'pass';
    resultsNode.textContent = JSON.stringify(results, null, 2);
  </script>
</body>
</html>
