<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aihio Browser Tests</title>
  <link rel="stylesheet" href="../../dist/aihio.css">
</head>
<body data-status="running">
  <main id="sandbox"></main>
  <pre id="results"></pre>

  <script type="module">
    globalThis.requestAnimationFrame = (callback) => setTimeout(() => callback(performance.now()), 0);
    globalThis.cancelAnimationFrame = (handle) => clearTimeout(handle);

    import '../../dist/aihio.js';

    const sandbox = document.querySelector('#sandbox');
    const resultsNode = document.querySelector('#results');
    const results = [];

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }

    function dispatchKey(target, key, options = {}) {
      target.dispatchEvent(new KeyboardEvent('keydown', {
        key,
        bubbles: true,
        composed: true,
        ...options,
      }));
    }

    function dataUriSvg(markup) {
      return `data:image/svg+xml,${encodeURIComponent(markup)}`;
    }

    async function nextFrame(count = 1) {
      for (let index = 0; index < count; index += 1) {
        await new Promise((resolve) => requestAnimationFrame(resolve));
      }
    }

    async function runTest(name, fn) {
      try {
        sandbox.replaceChildren();
        await fn();
        results.push({ name, pass: true });
      } catch (error) {
        results.push({
          name,
          pass: false,
          message: error?.stack ?? String(error),
        });
      }
    }

    await runTest('button and toggle sync disabled state', async () => {
      sandbox.innerHTML = `
        <aihio-button id="button" disabled>Save</aihio-button>
        <aihio-toggle id="toggle" pressed disabled>Bold</aihio-toggle>
      `;
      await nextFrame(2);

      const button = document.querySelector('#button');
      const toggle = document.querySelector('#toggle');

      assert(button.control instanceof HTMLButtonElement, 'the button should delegate to a native <button>');
      assert(button.control.textContent.trim() === 'Save', 'the label should be adopted into the control');
      assert(button.control.disabled, 'disabled should disable the control natively');

      let clicks = 0;
      button.addEventListener('click', () => {
        clicks += 1;
      });
      button.click();
      assert(clicks === 0, 'disabled button click should be suppressed');

      button.removeAttribute('disabled');
      await nextFrame();
      assert(!button.control.disabled, 'the control should be re-enabled with the host');

      button.click();
      await nextFrame();
      assert(clicks === 1, 'an enabled button should click through to the host');

      assert(toggle.control instanceof HTMLButtonElement, 'the toggle should delegate to a native <button>');
      assert(toggle.control.type === 'button', 'a toggle control never submits');
      assert(toggle.control.getAttribute('aria-pressed') === 'true', 'toggle should reflect pressed state on its control');
      assert(toggle.control.disabled, 'disabled should disable the toggle control natively');
      toggle.click();
      await nextFrame();
      assert(toggle.hasAttribute('pressed'), 'a disabled toggle should not change state');

      let toggleEvents = 0;
      toggle.addEventListener('aihio-toggle', () => {
        toggleEvents += 1;
      });
      toggle.removeAttribute('disabled');
      await nextFrame();
      toggle.click();
      await nextFrame();
      assert(toggle.control.getAttribute('aria-pressed') === 'false', 'toggle should sync aria-pressed after click');
      assert(!toggle.pressed && toggleEvents === 1, 'a click should unpress the toggle and emit aihio-toggle once');
    });

    await runTest('input and avatar resync after attribute changes', async () => {
      sandbox.innerHTML = `
        <aihio-input id="input" value="A" placeholder="Hello"></aihio-input>
        <aihio-avatar id="avatar" alt="Jane Doe"></aihio-avatar>
      `;
      await nextFrame(2);

      const input = document.querySelector('#input');
      const innerInput = input.querySelector('input');
      const avatar = document.querySelector('#avatar');

      assert(innerInput.value === 'A', 'input value should be initialized');
      input.setAttribute('value', 'B');
      input.setAttribute('placeholder', 'Updated');
      input.setAttribute('disabled', '');
      await nextFrame();
      assert(innerInput.value === 'B', 'input value should update after attribute change');
      assert(innerInput.placeholder === 'Updated', 'input placeholder should update');
      assert(innerInput.disabled === true, 'input disabled should sync');

      input.value = 'C';
      await nextFrame();
      assert(innerInput.value === 'C', 'setting input.value should sync to inner input');

      assert(avatar.textContent.trim() === 'JD', 'avatar should derive initials from alt');
      avatar.setAttribute('fallback', 'ZZ');
      await nextFrame();
      assert(avatar.textContent.trim() === 'ZZ', 'avatar fallback should update');

      avatar.setAttribute('src', dataUriSvg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 4"><rect width="4" height="4" fill="black"/></svg>'));
      await nextFrame(2);
      assert(Boolean(avatar.querySelector('img')), 'avatar should render an image when src is set');

      avatar.removeAttribute('src');
      await nextFrame();
      assert(avatar.textContent.trim() === 'ZZ', 'avatar should return to fallback text when src is removed');
    });

    await runTest('tabs wire aria relationships and keyboard navigation', async () => {
      sandbox.innerHTML = `
        <aihio-tabs id="tabs">
          <aihio-tab-list>
            <aihio-tab value="account">Account</aihio-tab>
            <aihio-tab value="password">Password</aihio-tab>
          </aihio-tab-list>
          <aihio-tab-panel value="account">Account panel</aihio-tab-panel>
          <aihio-tab-panel value="password">Password panel</aihio-tab-panel>
        </aihio-tabs>
      `;
      await nextFrame(2);

      const tabs = document.querySelector('#tabs');
      const tabList = tabs.querySelector('aihio-tab-list');
      const [accountTab, passwordTab] = tabs.querySelectorAll('aihio-tab');
      const [accountPanel, passwordPanel] = tabs.querySelectorAll('aihio-tab-panel');

      assert(accountTab.hasAttribute('active'), 'first enabled tab should be active by default');
      assert(accountTab.getAttribute('aria-controls') === accountPanel.id, 'tab should reference its panel');
      assert(accountPanel.getAttribute('aria-labelledby') === accountTab.id, 'panel should reference its tab');

      passwordTab.click();
      await nextFrame();
      assert(tabs.getAttribute('value') === 'password', 'clicking a tab should update the tabs value');
      assert(passwordPanel.hidden === false && accountPanel.hidden === true, 'panels should toggle visibility');

      passwordTab.focus();
      dispatchKey(tabList, 'ArrowLeft');
      await nextFrame();
      assert(accountTab.hasAttribute('active'), 'ArrowLeft should move selection to the previous tab');
      assert(document.activeElement === accountTab, 'keyboard navigation should move focus');
    });

    await runTest('dropdown keyboard flow opens, navigates, and restores focus', async () => {
      sandbox.innerHTML = `
        <aihio-dropdown id="dropdown">
          <aihio-button id="trigger" slot="trigger">Open</aihio-button>
          <aihio-dropdown-item>Profile</aihio-dropdown-item>
          <aihio-dropdown-item>Billing</aihio-dropdown-item>
        </aihio-dropdown>
      `;
      await nextFrame(2);

      const dropdown = document.querySelector('#dropdown');
      const trigger = document.querySelector('#trigger');
      const items = dropdown.querySelectorAll('aihio-dropdown-item');

      trigger.focus();
      dispatchKey(trigger, 'ArrowDown');
      await nextFrame(2);
      assert(dropdown.hasAttribute('open'), 'ArrowDown on the trigger should open the dropdown');
      assert(document.activeElement === items[0], 'opening the dropdown should focus the first item');

      dispatchKey(items[0], 'ArrowDown');
      await nextFrame();
      assert(document.activeElement === items[1], 'ArrowDown should move focus to the next item');

      dispatchKey(items[1], 'Escape');
      await nextFrame();
      assert(!dropdown.hasAttribute('open'), 'Escape should close the dropdown');
      assert(document.activeElement === trigger.control, 'closing the dropdown should restore focus to the trigger');
    });

    await runTest('dialog focuses content, traps focus, and restores opener focus', async () => {
      sandbox.innerHTML = `
        <button id="opener">Open</button>
        <aihio-dialog id="dialog">
          <aihio-dialog-header>
            <aihio-dialog-title>Dialog title</aihio-dialog-title>
            <aihio-dialog-description>Dialog description</aihio-dialog-description>
          </aihio-dialog-header>
          <button id="first">First</button>
          <button id="last">Last</button>
        </aihio-dialog>
      `;
      await nextFrame(2);

      const opener = document.querySelector('#opener');
      const dialog = document.querySelector('#dialog');
      const first = dialog.querySelector('#first');
      const last = dialog.querySelector('#last');

      opener.focus();
      dialog.open();
      await nextFrame(3);

      assert(dialog.hasAttribute('open'), 'dialog.open() should set the open attribute');
      assert(document.activeElement === first, 'opening the dialog should focus the first slotted focus target');
      assert(dialog.shadowRoot.querySelector('.panel').getAttribute('aria-labelledby'), 'dialog panel should be labelled');

      last.focus();
      dispatchKey(last, 'Tab');
      await nextFrame();
      assert(document.activeElement === first, 'Tab on the last item should wrap to the first item');

      dispatchKey(document, 'Escape');
      await nextFrame();
      assert(!dialog.hasAttribute('open'), 'Escape should close the dialog');
      assert(document.activeElement === opener, 'closing the dialog should restore focus to the opener');
    });

    await runTest('buttons submit and reset their owning form', async () => {
      sandbox.innerHTML = `
        <form id="signin">
          <label>Email
            <aihio-input name="email" type="email" value="a@b.co" aria-label="Email"></aihio-input>
          </label>
          <aihio-button type="reset">Clear</aihio-button>
          <aihio-button type="submit">Sign in</aihio-button>
          <aihio-button>Plain</aihio-button>
        </form>
      `;
      await nextFrame(2);

      const form = sandbox.querySelector('#signin');
      const [reset, submit, plain] = [...sandbox.querySelectorAll('aihio-button')];

      assert(submit.form === form, 'a button should resolve its owning form');
      assert([...form.elements].includes(submit.control), 'the control should be a member of form.elements');
      assert(form.elements.email?.value === 'a@b.co', 'the named field should be submittable');

      // Being a real submit button in the form is what makes Enter in a field
      // submit it: implicit submission looks for a submit button and does
      // nothing when a form with several fields has none.
      assert(submit.control.type === 'submit', 'type should be forwarded to the control');
      assert(form.querySelector('button[type="submit"]') === submit.control, 'the form should own a native submit button');

      let submits = 0;
      let submitter = null;
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submits += 1;
        submitter = event.submitter;
      });

      plain.click();
      await nextFrame();
      assert(submits === 0, 'a default button must not submit');

      submit.click();
      await nextFrame();
      assert(submits === 1, 'type="submit" should submit the owning form');
      assert(submitter === submit.control, 'the submit event should identify the button as its submitter');

      const field = sandbox.querySelector('aihio-input');
      field.value = 'changed@b.co';
      await nextFrame();
      reset.click();
      await nextFrame();
      assert(
        form.elements.email.value === 'a@b.co',
        `type="reset" should reset the form, got ${form.elements.email.value}`
      );
    });

    await runTest('fieldset disabled toggles the button in both directions', async () => {
      sandbox.innerHTML = `
        <form>
          <fieldset id="fieldset">
            <aihio-button id="plain">Save</aihio-button>
            <aihio-button id="authored" disabled>Never</aihio-button>
          </fieldset>
        </form>
      `;
      await nextFrame(2);

      const fieldset = sandbox.querySelector('#fieldset');
      const plain = sandbox.querySelector('#plain');
      const authored = sandbox.querySelector('#authored');

      // A fieldset disables its controls without touching their attributes, so
      // :disabled — not the reflected .disabled property — is what says whether
      // a control is actually disabled.
      let clicks = 0;
      plain.addEventListener('click', () => {
        clicks += 1;
      });

      assert(!plain.control.matches(':disabled'), 'a button in an enabled fieldset should be enabled');

      fieldset.disabled = true;
      await nextFrame();
      assert(plain.control.matches(':disabled'), '<fieldset disabled> should disable the control');
      plain.click();
      await nextFrame();
      assert(clicks === 0, 'a button in a disabled fieldset should not activate');

      fieldset.disabled = false;
      await nextFrame();
      assert(!plain.control.matches(':disabled'), 're-enabling the fieldset should re-enable the control');
      plain.click();
      await nextFrame();
      assert(clicks === 1, 'a re-enabled button should activate again');

      assert(authored.control.matches(':disabled'), 'an explicitly disabled button should stay disabled');
      assert(authored.hasAttribute('disabled'), 'the authored disabled attribute should survive');
    });

    await runTest('button mirrors aria-* onto the control it delegates to', async () => {
      sandbox.innerHTML = `
        <aihio-button id="icon" size="icon" aria-label="Close">&#x2715;</aihio-button>
      `;
      await nextFrame(2);

      const icon = sandbox.querySelector('#icon');
      assert(icon.control.getAttribute('aria-label') === 'Close', 'aria-label should reach the control');

      icon.setAttribute('aria-label', 'Dismiss');
      await nextFrame();
      assert(icon.control.getAttribute('aria-label') === 'Dismiss', 'the mirror should follow the host');

      icon.removeAttribute('aria-label');
      await nextFrame();
      assert(!icon.control.hasAttribute('aria-label'), 'removing it on the host should clear the mirror');

      icon.setAttribute('loading', '');
      await nextFrame();
      assert(icon.control.getAttribute('aria-busy') === 'true', 'loading should mark the control busy');
      assert(icon.control.disabled, 'loading should disable the control');
    });

    await runTest('button adopts an authored control instead of duplicating it', async () => {
      sandbox.innerHTML = `
        <form id="authored-form">
          <aihio-button id="wrapper" variant="outline"><button type="submit" name="authored" disabled>Sign in</button></aihio-button>
        </form>
      `;
      await nextFrame(2);

      const wrapper = sandbox.querySelector('#wrapper');
      const controls = wrapper.querySelectorAll('button');

      assert(controls.length === 1, 'an authored <button> should not be duplicated');
      assert(wrapper.control === controls[0], 'the authored button should become the control');
      assert(wrapper.control.type === 'submit', 'an authored type should survive when the host states none');
      assert(wrapper.type === 'submit', 'the host should report the type it delegates to');
      assert(wrapper.control.disabled, 'an authored disabled state should survive');

      wrapper.setAttribute('name', 'override');
      await nextFrame();
      assert(wrapper.control.name === 'override', 'a host form attribute should override the authored control');
      wrapper.removeAttribute('name');
      await nextFrame();
      assert(wrapper.control.name === 'authored', 'removing a host override should restore the authored attribute');

      wrapper.setAttribute('type', 'button');
      await nextFrame();
      assert(wrapper.control.type === 'button', 'a host type should win over the authored one');
    });

    await runTest('field wires labelling, description, and error state', async () => {
      sandbox.innerHTML = `
        <aihio-field id="plain">
          <label slot="label">Email</label>
          <aihio-input type="email" name="email"></aihio-input>
          <span slot="description">Use your work address.</span>
        </aihio-field>
        <aihio-field id="invalid">
          <label slot="label">Password</label>
          <aihio-input type="password" name="password"></aihio-input>
          <span slot="description">At least 12 characters.</span>
          <span slot="error">Password is too short.</span>
        </aihio-field>
      `;
      await nextFrame(2);

      const plain = sandbox.querySelector('#plain');
      const plainControl = plain.querySelector('aihio-input');
      const plainLabel = plain.querySelector('[slot="label"]');

      assert(plainControl.id.length > 0, 'the control should be given an id');
      assert(
        plainLabel.getAttribute('for') === plainControl.control.id,
        'a <label> in the label slot should point at the native control'
      );
      assert(
        plainControl.getAttribute('aria-labelledby') === plainLabel.id,
        'the control should be labelled by the label slot'
      );
      assert(
        plainControl.getAttribute('aria-describedby') ===
          plain.querySelector('[slot="description"]').id,
        'the control should be described by the description slot'
      );
      assert(!plain.hasAttribute('error'), 'a field with no error slot is not in error state');

      const invalid = sandbox.querySelector('#invalid');
      const invalidControl = invalid.querySelector('aihio-input');

      assert(invalid.hasAttribute('error'), 'error slot content should set the error state');
      assert(invalidControl.hasAttribute('error'), 'the error state should reach the control');
      assert(
        invalidControl.getAttribute('aria-describedby') ===
          invalid.querySelector('[slot="error"]').id,
        'while erroring, aria-describedby should point at the error, not the description'
      );
      assert(
        invalidControl.querySelector('input').getAttribute('aria-invalid') === 'true',
        'the inner input should be marked invalid'
      );
    });

    await runTest('combobox filters, navigates, commits, and submits the value', async () => {
      sandbox.innerHTML = `
        <form id="picker">
          <aihio-field>
            <label slot="label">Country</label>
            <aihio-combobox id="country" name="country" value="fi">
              <aihio-option value="fi">Finland</aihio-option>
              <aihio-option value="se">Sweden</aihio-option>
              <aihio-option value="no" disabled>Norway</aihio-option>
              <aihio-option value="ax">Åland Islands</aihio-option>
            </aihio-combobox>
          </aihio-field>
        </form>
      `;
      await nextFrame(2);

      const form = sandbox.querySelector('#picker');
      const combobox = sandbox.querySelector('#country');
      const input = combobox.control;
      const label = sandbox.querySelector('[slot="label"]');
      const listbox = combobox.querySelector('[role="listbox"]');
      const activeText = () =>
        document.getElementById(input.getAttribute('aria-activedescendant') ?? '')?.textContent.trim() ?? null;
      const visible = () =>
        [...listbox.querySelectorAll('[role="option"]:not([hidden])')].map((option) => option.textContent.trim());

      assert(input.getAttribute('role') === 'combobox', 'the text input should carry role="combobox"');
      assert(input.value === 'Finland', 'the default value should show its option label');
      assert(label.getAttribute('for') === input.id, 'the field label should point at the text input');
      assert(input.getAttribute('aria-labelledby') === label.id, 'the input should be labelled by the field label');
      assert(listbox.getAttribute('aria-labelledby') === label.id, 'the listbox should share the field label');
      assert(input.getAttribute('aria-controls') === listbox.id, 'the input should control the listbox');
      assert(combobox.querySelectorAll(':scope > aihio-option').length === 4, 'authored options should stay where they were written');

      input.focus();
      dispatchKey(input, 'ArrowDown');
      await nextFrame();
      assert(combobox.hasAttribute('open'), 'ArrowDown should open the list');
      assert(input.getAttribute('aria-expanded') === 'true', 'aria-expanded should follow the list');
      assert(activeText() === 'Finland', 'opening should highlight the chosen option');

      dispatchKey(input, 'ArrowDown');
      dispatchKey(input, 'ArrowDown');
      assert(activeText() === 'Åland Islands', 'ArrowDown should skip the disabled option');

      dispatchKey(input, 'Escape');
      await nextFrame();
      assert(!combobox.hasAttribute('open'), 'Escape should close the list');
      assert(!input.hasAttribute('aria-activedescendant'), 'a closed list should have no active descendant');
      assert(combobox.value === 'fi', 'Escape should not change the value');

      let change = null;
      combobox.addEventListener('aihio-change', (event) => {
        change = event.detail;
      });

      input.value = 'ALAND';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      await nextFrame();
      assert(combobox.hasAttribute('open'), 'typing should open the list');
      assert(visible().join('|') === 'Åland Islands', `matching should ignore case and accents, got ${visible().join('|')}`);
      assert(activeText() === 'Åland Islands', 'typing should highlight the best match');

      dispatchKey(input, 'Enter');
      await nextFrame();
      assert(combobox.value === 'ax', 'Enter should commit the highlighted option');
      assert(input.value === 'Åland Islands', 'the field should show the chosen label');
      assert(change?.value === 'ax' && change?.label === 'Åland Islands', 'aihio-change should carry value and label');
      assert(new FormData(form).get('country') === 'ax', 'the form should submit the value, not the label');

      form.reset();
      await new Promise((resolve) => setTimeout(resolve, 20));
      assert(combobox.value === 'fi', 'reset should restore the default value');
      assert(input.value === 'Finland', 'reset should restore the default label');
    });

    await runTest('table sorts by a header button, keeps aria-sort on the th, and announces', async () => {
      sandbox.innerHTML = `
        <aihio-table id="invoices">
          <table>
            <caption>Invoices</caption>
            <thead>
              <tr>
                <th scope="col" data-sortable="invoice">Invoice</th>
                <th scope="col" data-sortable="amount" data-numeric>Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr><th scope="row">INV-1043</th><td data-numeric>€980.50</td></tr>
              <tr><th scope="row">INV-1042</th><td data-numeric>€1,250.00</td></tr>
              <tr><th scope="row">INV-1044</th><td data-numeric>€12,400.00</td></tr>
            </tbody>
          </table>
        </aihio-table>
      `;
      await nextFrame(2);

      const host = sandbox.querySelector('#invoices');
      const [invoice, amount] = host.table.tHead.rows[0].cells;
      const order = () => [...host.table.tBodies[0].rows].map((row) => row.cells[0].textContent.trim()).join(' ');
      const status = host.querySelector(':scope > [role="status"]');
      let sorted = null;
      host.addEventListener('aihio-sort', (event) => {
        sorted = event.detail;
      });

      const button = amount.querySelector(':scope > button[data-table-part="sort"]');
      assert(button, 'a sortable header should get a sort button');
      assert(button.type === 'button', 'the sort button should never submit a form');
      assert(button.textContent.trim() === 'Amount', 'the header text should move into the button');
      assert(!invoice.hasAttribute('aria-sort') && !amount.hasAttribute('aria-sort'), 'nothing is sorted yet');

      button.click();
      assert(amount.getAttribute('aria-sort') === 'ascending', 'the th, not the button, should carry aria-sort');
      assert(order() === 'INV-1043 INV-1042 INV-1044', `figures should sort as numbers, got ${order()}`);
      assert(sorted?.column === 'amount' && sorted?.direction === 'ascending', 'aihio-sort should name the column and direction');
      await new Promise((resolve) => setTimeout(resolve, 200));
      assert(status.textContent === 'Sorted by Amount, ascending', `the sort should be announced, got "${status.textContent}"`);

      invoice.querySelector('button').click();
      assert(invoice.getAttribute('aria-sort') === 'ascending', 'the newly sorted header should carry aria-sort');
      assert(!amount.hasAttribute('aria-sort'), 'only one header should carry aria-sort');
      assert(order() === 'INV-1042 INV-1043 INV-1044', `text should sort in order, got ${order()}`);

      invoice.querySelector('button').click();
      assert(invoice.getAttribute('aria-sort') === 'descending', 'a second activation should sort descending');
      assert(order() === 'INV-1044 INV-1043 INV-1042', `descending should reverse the order, got ${order()}`);
    });

    const failed = results.some((result) => !result.pass);
    document.body.dataset.status = failed ? 'fail' : 'pass';
    resultsNode.textContent = JSON.stringify(results, null, 2);
  </script>
</body>
</html>
