<aihio-button
  data-aihio-intent="destructive-action"
  variant="destructive"
  commandfor="delete-project"
  command="--open"
>Delete project</aihio-button>

<aihio-dialog id="delete-project" data-aihio-intent="overlay modal dismissible">
  <aihio-dialog-header>
    <aihio-dialog-title>Delete project?</aihio-dialog-title>
    <aihio-dialog-description>
      This permanently removes project access, deploy history, and notification rules.
    </aihio-dialog-description>
  </aihio-dialog-header>
  <form method="post">
    <aihio-dialog-footer>
      <aihio-button
        data-aihio-intent="secondary-action"
        variant="outline"
        commandfor="delete-project"
        command="--close"
      >Cancel</aihio-button>
      <aihio-button data-aihio-intent="destructive-action" variant="destructive" type="submit">Delete project</aihio-button>
    </aihio-dialog-footer>
  </form>
</aihio-dialog>
