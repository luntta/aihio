<form data-aihio-intent="form-field">
  <aihio-stack data-aihio-intent="layout">
    <aihio-field data-aihio-intent="form-field">
      <label slot="label">Password</label>
      <aihio-input
        data-aihio-intent="text-entry"
        type="password"
        name="password"
        autocomplete="new-password"
        required
      ></aihio-input>
      <span slot="description">At least 12 characters, including one symbol.</span>
      <span slot="error">Password must include at least 12 characters and one symbol.</span>
    </aihio-field>

    <aihio-alert data-aihio-intent="alert" variant="destructive">
      <div slot="title">Password is too weak</div>
      <div slot="description">Update the field above, then resubmit the form.</div>
    </aihio-alert>

    <aihio-cluster data-aihio-intent="layout" grow justify="end">
      <aihio-button data-aihio-intent="secondary-action" variant="outline" type="reset">Cancel</aihio-button>
      <aihio-button data-aihio-intent="primary-action" type="submit">Save password</aihio-button>
    </aihio-cluster>
  </aihio-stack>
</form>
