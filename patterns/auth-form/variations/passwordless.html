<aihio-card data-aihio-intent="surface">
  <form>
    <aihio-card-header>
      <aihio-card-title>Email me a sign-in link</aihio-card-title>
      <aihio-card-description>We will send a one-time login link to your inbox.</aihio-card-description>
    </aihio-card-header>
    <aihio-card-content>
      <aihio-field data-aihio-intent="form-field">
        <label slot="label">Email</label>
        <aihio-input
          data-aihio-intent="text-entry"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        ></aihio-input>
        <span slot="description">The link expires after 10 minutes.</span>
      </aihio-field>
    </aihio-card-content>
    <aihio-card-footer>
      <aihio-cluster data-aihio-intent="layout" grow justify="end">
        <aihio-button data-aihio-intent="secondary-action" variant="outline">Use password instead</aihio-button>
        <aihio-button data-aihio-intent="primary-action" type="submit">Send magic link</aihio-button>
      </aihio-cluster>
    </aihio-card-footer>
  </form>
</aihio-card>
